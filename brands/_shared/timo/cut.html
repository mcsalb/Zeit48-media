<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="overlay.css">
<style>
#f{background:#F4EFE4}
.L{position:absolute;left:0;top:0;transform-origin:0 0}
.L img{position:absolute;left:0;top:0;display:block}
.hl{position:absolute;left:80px;right:80px;top:210px;font-family:AR;font-weight:900;font-size:96px;line-height:.95;letter-spacing:-2px;color:#1E3B2C;text-transform:uppercase}
.hl em{font-style:normal;color:#E08414}
.cap{position:absolute;left:70px;right:70px;top:1600px;text-align:center;font-family:AR;font-weight:900;font-size:62px;line-height:1.12;color:#1E3B2C;text-transform:uppercase}
.cap span{background:#F4EFE4;padding:4px 16px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:8px}
.cap b{color:#E08414}
.card{position:absolute;left:470px;top:600px;width:560px;background:#fff;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.18);padding:36px 36px 30px;transform-origin:20% 50%}
.card .lb{font-family:AR;font-weight:800;font-size:26px;letter-spacing:5px;color:#D2462E}
.card .r{display:flex;justify-content:space-between;align-items:baseline;font-family:IN;font-size:31px;color:#1B1B18;padding:14px 0;border-bottom:3px dashed #D9D1BF}
.card .r b{font-family:AR;font-weight:900;font-size:40px;color:#1E3B2C}
.card .r i{display:block;font-style:normal;font-family:CV;font-weight:700;font-size:28px;color:#D2462E}
.stamp{position:absolute;left:520px;top:330px;border:12px solid #D2462E;border-radius:20px;padding:10px 30px;font-family:AR;font-weight:900;color:#D2462E;background:rgba(244,239,228,.85);text-align:center;font-size:110px;line-height:1;transform-origin:50% 50%}
.stamp small{display:block;font-size:32px;letter-spacing:4px;font-weight:800;margin-top:6px}
.chip{position:absolute;left:560px;top:700px;background:#1E3B2C;color:#F4EFE4;border-radius:22px;padding:28px 34px;font-family:IN;font-size:36px;line-height:1.3;width:460px}
.chip b{color:#F2A33A;font-family:AR;font-weight:900;font-size:44px;display:block;margin-bottom:6px}
.end{position:absolute;inset:0;background:#1E3B2C;display:flex;flex-direction:column;align-items:center;justify-content:center}
.end .w{font-family:AR;font-weight:900;font-size:112px;color:#F4EFE4;letter-spacing:-2px}.end .w b{color:#F2A33A}
.end .n{font-family:CV;font-weight:700;font-size:62px;color:#F2A33A;margin-top:40px;transform:rotate(-2.5deg)}
.end .h{font-family:IN;font-size:34px;color:#E9E3D4;margin-top:60px;opacity:.8}
</style></head><body>
<div id="f"><svg id="bg" viewBox="0 0 1080 1920" width="1080" height="1920" style="position:absolute;inset:0"></svg><div id="stage"></div><div id="ov"></div></div>
<script>
// Assets (4x-Raster aus den Charakterblättern). m=[x,y,Breite-Skala,Rotation] = Mundmitte im Asset-Raster
const A={
 p1:{w:1080,h:2280,m:[612,288,.30,0],foot:2230},
 p2:{w:1320,h:2280,m:[588,300,.29,0],foot:2230},
 p4:{w:1300,h:2280,m:[632,284,.25,0],foot:2230},
 p5:{w:1080,h:2280,m:[636,264,.31,0],foot:2230},
 p6:{w:1080,h:2280,m:[640,272,.24,-8],foot:2230},
 e1:{w:1260,h:1480,m:[708,668,.81,0]},
 e4:{w:1240,h:1480,m:[708,700,.85,0]},
 e6:{w:1260,h:1480,m:null},
};
const MW=440,MH=272,MAX=55*4*0+220,MAY=25*4; // Ankerpunkt im Mund-Patch (Mitte, Oberlippe)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),win=(t,a,b)=>cl((t-a)/(b-a));
const EO=t=>1-Math.pow(1-cl(t),3),EIO=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},EB=t=>{t=cl(t);const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
// Layer-Elemente vorab anlegen (Bilder bleiben geladen)
const stage=document.getElementById('stage');const L={};
for(const k in A){const d=document.createElement('div');d.className='L';d.style.width=A[k].w+'px';d.style.height=A[k].h+'px';
 d.innerHTML=`<img src="as/${k}.r.png" width="${A[k].w}" height="${A[k].h}">`+(A[k].m?`<img class="mo" width="${MW}" height="${MH}">`:'');d.style.display='none';stage.appendChild(d);L[k]=d}
const MO=[...Array(9).keys()].map(i=>i?`as/m${i}.png`:'');
MO.slice(1).forEach(s=>{const i=new Image();i.src=s});
function show(k,x,y,s,op,mouth,extra){const d=L[k],a=A[k];d.style.display='block';d.style.opacity=op;
 d.style.transform=`translate(${x}px,${y}px) scale(${s}) ${extra||''}`;
 if(a.m){const mo=d.querySelector('.mo');if(mouth){mo.style.display='block';mo.src=MO[mouth];const[mx,my,ms,mr]=a.m;
  mo.style.transform=`translate(${mx-MAX*ms}px,${my-MAY*ms*.85}px) rotate(${mr}deg) scale(${ms},${ms*.85})`;mo.style.transformOrigin='0 0'}else mo.style.display='none'}}
let SYNC,SEG,T,SHOTS;
fetch('vo/sync.json').then(r=>r.json()).then(s=>{SYNC=s;SEG=s.segs;T=s.T+2.4;build();window.render=render;
 Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>window.ready=true)});
function build(){const s=SEG.map(x=>x.t0),e=SEG.map(x=>x.t1),st=s[2]+(e[2]-s[2])*.62;
 // Einstellungen: Asset, Start, Kamera (Mittelpunkt x, Fußpunkt/Unterkante y, Skala) Start->Ende
 SHOTS=[
  {k:'p1',t:0,c0:[560,560,1.0],c1:[560,530,1.07]},
  {k:'p4',t:s[1]-.1,c0:[560,570,.98],c1:[560,550,1.03]},
  {k:'p2',t:s[2]-.1,c0:[330,600,.9],c1:[330,590,.93]},
  {k:'e4',t:st,c0:[540,1990,1.15],c1:[540,1990,1.22],face:1},
  {k:'p6',t:s[3]-.1,c0:[380,560,1.0],c1:[380,530,1.06]},
  {k:'p5',t:s[4]-.1,c0:[540,560,1.0],c1:[540,530,1.06]},
  {k:'e6',t:e[4]-.25,c0:[540,1990,1.12],c1:[540,1990,1.18],face:1},
 ];
 SHOTS.forEach((x,i)=>x.t1=i<SHOTS.length-1?SHOTS[i+1].t:T);
}
function speaking(t){return SEG.some(x=>t>=x.t0&&t<=x.t1)}
function chunks(txt,t0,t1,t){const w=txt.split(' ');const ch=[];let c=[];for(const x of w){c.push(x);if(c.join(' ').length>16||/[.?!:,]$/.test(x)){ch.push(c.join(' '));c=[]}}if(c.length)ch.push(c.join(' '));
 const tot=ch.reduce((a,x)=>a+x.length,0);let acc=t0;for(const x of ch){const d=(t1-t0)*x.length/tot;if(t<acc+d)return x;acc+=d}return ch[ch.length-1]}
const CAPS=['2 % Skonto liegen lassen? Das ist teurer, als du denkst.','Viele sagen: Sind doch nur 2 %.','Aber du zahlst nur 20 Tage früher. Aufs Jahr gerechnet sind das rund 37 % Zins.','Selbst ein Kontokorrentkredit ist meistens günstiger.','Also: Skonto ziehen! Speichern und einem Chef schicken.'];
function render(t){
 const s=SEG.map(x=>x.t0),e=SEG.map(x=>x.t1);
 const fi=Math.floor(t*30),sp=speaking(t),mouth=sp?(SYNC.mouth[fi]||1):1;
 for(const k in L)L[k].style.display='none';
 let cur=SHOTS.findIndex(x=>t>=x.t&&t<x.t1);if(cur<0)cur=SHOTS.length-1;
 const draw=(sh,op)=>{const a=A[sh.k],k=EIO(win(t,sh.t,sh.t1));const c=sh.c0.map((v,i)=>v+(sh.c1[i]-v)*k);
  const pop=EB(win(t,sh.t,sh.t+.28));const sc=c[2]*(.94+.06*pop)*(a.w>1200&&!sh.face?1:1);
  const bre=Math.sin(t*2.3)*.004,sway=Math.sin(t*.9)*.5;
  const x=c[0]-a.w/2*sc,y=sh.face?c[1]-a.h*sc:c[1]-40*sc;
  show(sh.k,x,y,sc,op,(sh.face&&sh.k==='e6')?0:mouth,`rotate(${sway*.4}deg) scale(1,${1+bre})`)};
 // Überblendung 0.12 s
 const sh=SHOTS[cur];const pr=SHOTS[cur-1];
 if(pr&&t<sh.t+.12)draw(pr,1);
 draw(sh,cur>0?EO(win(t,sh.t,sh.t+.12)):1);
 // Hintergrund
 const bgX=-20*Math.sin(t*.25);
 let svg=`<rect width="1080" height="1920" fill="#F4EFE4"/>`;for(let y=60;y<1920;y+=64)svg+=`<rect y="${y}" width="1080" height="2" fill="#1E3B2C" opacity=".05"/>`;
 const px=sh.c0[0];svg+=`<g transform="translate(${bgX+(px-540)*.5} 0)"><path d="M390 470 L870 470 Q910 470 900 510 L770 1600 Q764 1640 724 1640 L240 1640 Q200 1640 208 1600 L340 510 Q346 470 390 470Z" fill="#1E3B2C"/></g>`;
 svg+=`<rect y="1760" width="1080" height="160" fill="#E3D9C5"/>`;
 document.getElementById('bg').innerHTML=svg;
 // Overlay
 let h='<div class="wm" style="top:120px;left:80px">CHEFSACHE<b>48</b></div>';
 const hlO=1-win(t,s[1]-.4,s[1]);if(hlO>0)h+=`<div class="hl" style="opacity:${hlO}">2 % Skonto<br><em>liegen lassen?</em></div>`;
 if(t>s[1]+.9&&t<e[1]+.1){const k=EB(win(t,s[1]+.9,s[1]+1.2));h+=`<div class="bub" style="left:110px;top:300px;transform:scale(${k})">„Sind doch nur 2 %…“</div>`}
 const st=s[2]+(e[2]-s[2])*.62,d=e[2]-s[2];
 if(t>s[2]-.1&&t<st+.05){const k=EB(win(t,s[2]-.1,s[2]+.3));
  const rows=[['Rechnung <i>Beispiel</i>','10.000 €',0],['2 % Skonto','200 €',.12],['dafür früher zahlen','20 Tage',.3],['aufs Jahr gerechnet','?',.5]];
  let r='';rows.forEach(([a,b,o])=>{const q=EO(win(t,s[2]+d*o,s[2]+d*o+.3));r+=`<div class="r" style="opacity:${q};transform:translateX(${(1-q)*30}px)"><span>${a}</span><b>${b}</b></div>`});
  h+=`<div class="card" style="transform:scale(${k})"><div class="lb">BEISPIELRECHNUNG</div>${r}</div>`}
 if(t>st&&t<s[3]-.1){const q=win(t,st,st+.18);h+=`<div class="stamp" style="transform:rotate(-10deg) scale(${3-2*EO(q)});opacity:${cl(q*3)}">≈ 37 %<small>ZINS PRO JAHR</small></div>`}
 if(t>s[3]+.3&&t<e[3]+.4){const k=EB(win(t,s[3]+.3,s[3]+.65))*(1-EO(win(t,e[3],e[3]+.4)));h+=`<div class="chip" style="transform:scale(${k});transform-origin:0 50%"><b>Kontokorrent</b>meist deutlich günstiger als 37&nbsp;%. Prüf deine Konditionen.</div>`}
 if(t>s[4]&&t<e[4]-.25){const k=EB(win(t,s[4],s[4]+.35));h+=`<div class="hl" style="transform:scale(${k});transform-origin:0 0">Skonto<br><em>ziehen. ✓</em></div>`}
 for(let i=0;i<SEG.length;i++)if(t>=s[i]-.05&&t<=e[i]+.15){const tx=chunks(CAPS[i],s[i],e[i],t);h+=`<div class="cap"><span>${tx.replace(/(\d+ ?%|\d+\.\d+ €|\d+ Tage)/g,'<b>$1</b>')}</span></div>`}
 if(t>T-2.3){const k=EO(win(t,T-2.3,T-1.9));h+=`<div class="end" style="opacity:${k}"><div class="w" style="transform:scale(${.9+.1*k})">CHEFSACHE<b>48</b></div><div class="n">Speichern & einem Chef schicken ✓</div><div class="h">Beispielrechnung · keine Steuerberatung</div></div>`}
 h+=`<div class="bar" style="width:${t/T*1080}px"></div>`;
 document.getElementById('ov').innerHTML=h;
}
</script></body></html>
